# DEBUG kernel (development and bring-up only; never shipped in the PKG).
# cros_debug = developer mode; enforcing=0 = SELinux permissive; kernel log to the screen
# and over netconsole to the build PC (ignore_loglevel: the initramfs sets printk to 0).
set-str CONFIG_CMDLINE cros_efi cros_debug enforcing=0 ignore_loglevel netconsole=+6665@<PS4-IP>/eth0,6666@<PC-IP>/<PC-MAC>
enable CONFIG_SECURITY_SELINUX_DEVELOP
enable CONFIG_NETCONSOLE
enable CONFIG_MAGIC_SYSRQ
set-val CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE 0x1
enable CONFIG_DETECT_HUNG_TASK
set-val CONFIG_DEFAULT_HUNG_TASK_TIMEOUT 20
enable CONFIG_SOFTLOCKUP_DETECTOR
enable CONFIG_WQ_WATCHDOG
enable CONFIG_HARDLOCKUP_DETECTOR
enable CONFIG_HARDLOCKUP_DETECTOR_PERF
enable CONFIG_DEBUG_FS
enable CONFIG_FTRACE
enable CONFIG_ENABLE_DEFAULT_TRACERS
