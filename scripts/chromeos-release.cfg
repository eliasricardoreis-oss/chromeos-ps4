# RELEASE kernel (what the PKG installs): quiet, locked down, SELinux enforcing.
# Built-in cmdline, prepended to the payload's: Flex's cros_efi, quiet console.
set-str CONFIG_CMDLINE cros_efi quiet loglevel=3
# SELinux always enforcing (no enforcing=0 / setenforce 0). Checked against the ChromeOS
# policy: only cros_spaced sysfs reads are denied by enforcing, everything else that
# was denied in permissive runs is in ChromeOS's own permissive domains.
disable CONFIG_SECURITY_SELINUX_DEVELOP
# Kernel lockdown (integrity): no /dev/mem writes, no unsigned kexec, no raw I/O ports.
enable CONFIG_SECURITY_LOCKDOWN_LSM
enable CONFIG_SECURITY_LOCKDOWN_LSM_EARLY
enable CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY
set-str CONFIG_LSM lockdown,landlock,yama,selinux
enable CONFIG_STRICT_DEVMEM
enable CONFIG_IO_STRICT_DEVMEM
# No debug interfaces in production.
disable CONFIG_MAGIC_SYSRQ
disable CONFIG_NETCONSOLE
disable CONFIG_DEBUG_FS
disable CONFIG_FTRACE
disable CONFIG_KEXEC
disable CONFIG_KEXEC_FILE
