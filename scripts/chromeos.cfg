# ChromeOS userspace requirements, applied after the Strawberry profile configs.
enable CONFIG_SECURITY
enable CONFIG_SECURITY_YAMA
enable CONFIG_SECURITY_LANDLOCK
set-str CONFIG_LSM landlock,yama,selinux
enable CONFIG_DM_VERITY
enable CONFIG_DM_CRYPT
enable CONFIG_DM_INIT
enable CONFIG_CRYPTO_BLAKE2B
enable CONFIG_CRYPTO_SHA256
enable CONFIG_SQUASHFS
enable CONFIG_SQUASHFS_XZ
enable CONFIG_SQUASHFS_ZSTD
enable CONFIG_SQUASHFS_LZ4
enable CONFIG_OVERLAY_FS
enable CONFIG_FUSE_FS
enable CONFIG_BLK_DEV_LOOP
enable CONFIG_FS_ENCRYPTION
enable CONFIG_KEYS
enable CONFIG_ENCRYPTED_KEYS
enable CONFIG_EXT4_FS_POSIX_ACL
enable CONFIG_EXT4_FS_SECURITY
enable CONFIG_QUOTA
enable CONFIG_QUOTACTL
enable CONFIG_TMPFS_POSIX_ACL
enable CONFIG_TMPFS_XATTR
enable CONFIG_FANOTIFY
enable CONFIG_PSI
enable CONFIG_NAMESPACES
enable CONFIG_USER_NS
enable CONFIG_PID_NS
enable CONFIG_NET_NS
enable CONFIG_CGROUP_FREEZER
enable CONFIG_CGROUP_DEVICE
enable CONFIG_CGROUP_PIDS
enable CONFIG_CGROUP_BPF
enable CONFIG_BPF_SYSCALL
enable CONFIG_SECCOMP
enable CONFIG_SECCOMP_FILTER
enable CONFIG_ZRAM
enable CONFIG_ZSMALLOC
enable CONFIG_UHID
enable CONFIG_HIDRAW
enable CONFIG_INPUT_UINPUT
enable CONFIG_TUN
enable CONFIG_VETH
enable CONFIG_BRIDGE
enable CONFIG_VSOCKETS
enable CONFIG_VHOST_VSOCK
enable CONFIG_VHOST_NET
enable CONFIG_IKCONFIG
enable CONFIG_IKCONFIG_PROC
enable CONFIG_CMDLINE_BOOL
# CONFIG_CMDLINE is set by chromeos-release.cfg / chromeos-debug.cfg.
# ChromeOS's Upstart mounts selinuxfs at start and exits (PID 1 -> panic) if it can't.
# SELinux on (release: enforcing, like a Chromebook; debug: permissive via enforcing=0).
enable CONFIG_AUDIT
enable CONFIG_AUDITSYSCALL
enable CONFIG_SECURITY_NETWORK
enable CONFIG_SECURITY_SELINUX
enable CONFIG_SECURITY_SELINUX_AVC_STATS
# Found via SSH on the PS4 (chromeos_startup / upstart failures):
# STATE is ext4 with quota -> without QFMT_V2 the mount fails -> endless self-repair.
enable CONFIG_QUOTA
enable CONFIG_QUOTACTL
enable CONFIG_QUOTA_TREE
enable CONFIG_QFMT_V2
# SELinux refuses squashfs without xattrs -> cros_configfs fails -> boot-splash never runs.
enable CONFIG_SQUASHFS_XATTR
# chromeos_startup mounts /sys/kernel/security; pstore job. (debugfs/tracefs: debug build only.)
enable CONFIG_SECURITYFS
enable CONFIG_PSTORE
# cgroup v1 controllers ChromeOS still uses (newer kernels hide them behind *_V1):
# minijail puts CRAS and other services in /sys/fs/cgroup/cpuset/... - without cpuset
# v1 the sandbox aborts and the audio server never starts.
enable CONFIG_CPUSETS_V1
enable CONFIG_MEMCG_V1
enable CONFIG_CGROUP_NET_PRIO
