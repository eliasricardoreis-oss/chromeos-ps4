# PS4 layer: light tuning for 8 GB shared RAM + slow HDD (13 MB/s writes). Every line is
# best-effort ("|| true"): a missing knob never stops boot.
description "PS4 light tuning"
start on started boot-services
task
script
  # small, early writeback: avoids long stalls on the slow PS4 drive
  echo 5  > /proc/sys/vm/dirty_background_ratio || true
  echo 10 > /proc/sys/vm/dirty_ratio             || true
  echo 1500 > /proc/sys/vm/dirty_writeback_centisecs || true
  # zram swap is cheap, disk swap is not: prefer compressing RAM, no swap read-ahead
  echo 100 > /proc/sys/vm/swappiness   || true
  echo 0   > /proc/sys/vm/page-cluster || true
  # no transparent hugepages (less memory bloat/compaction on a small-RAM box)
  echo never > /sys/kernel/mm/transparent_hugepage/enabled || true
  # read-ahead a bit larger for sequential HDD reads
  for d in /sys/block/sd?/queue; do
    echo 512 > "$d/read_ahead_kb" 2>/dev/null || true
  done
end script
