name: Build extras (loader 14.02 + sistema leve)

on:
  workflow_dispatch:
    inputs:
      vram_mb:
        description: "VRAM do loader em MB (precisa bater com o vram.txt do seu build)"
        default: "1024"
  push:
    tags: ["extras-*"]

jobs:
  loader:
    runs-on: ubuntu-latest
    steps:
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential clang llvm yasm zip
      - name: Baixar o loader v25.3 (release com 14.02, NAO o master)
        run: |
          git clone --depth 1 --branch v25.3 https://github.com/ArabPixel/ps4-linux-loader loader
          grep -q "1402" loader/linux/Makefile
      - name: "Corrigir o kexec do 14.02 (a tag v25.3 esqueceu essas 3 linhas)"
        run: |
          f=loader/linux/main-aio.c
          if ! grep -q "case 1402" "$f"; then
            sed -i '/^asm("kexec_1400:/a asm("kexec_1402:\\n.incbin \\"kexec-build/1402/kexec.bin\\"\\nkexec_1402_end:\\n");' "$f"
            sed -i '/^extern char kexec_1400\[\]/a extern char kexec_1402[], kexec_1402_end[];' "$f"
            sed -i '/case 1400: \*start = kexec_1400;/a \    case 1402: *start = kexec_1402; *end = kexec_1402_end; break;' "$f"
          fi
          grep -n "1402" "$f"
          test "$(grep -c 1402 "$f")" -ge 3
      - name: Compilar
        run: cd loader/linux && make
      - name: Pegar o payload do tamanho certo
        run: |
          mkdir -p out
          V="${{ github.event.inputs.vram_mb || '1024' }}"
          f=$(find loader -name "linux-*${V}*.bin" | head -1)
          [ -n "$f" ] || { echo "payload ${V}MB nao encontrado:"; find loader -name 'linux-*.bin'; exit 1; }
          cp "$f" out/ps4-chromeos-loader.bin
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: loader-14.02, path: out/ps4-chromeos-loader.bin }

  bundle:
    needs: [loader]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Montar o zip de troca
        run: |
          mkdir -p z/ps4/data/linux/boot z/ps4/data/payloads z/pc
          cp dl/loader-14.02/ps4-chromeos-loader.bin z/ps4/data/linux/boot/
          cp dl/loader-14.02/ps4-chromeos-loader.bin z/ps4/data/payloads/
          cp -r layer-extra z/pc/layer-extra
          cp scripts/make-layer.sh z/pc/make-layer.sh
          cp LEIAME.txt z/
          (cd z && zip -r ../chromeos-ps4-swap.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: chromeos-ps4-swap, path: chromeos-ps4-swap.zip }
      - name: Release (so em tag extras-*)
        if: startsWith(github.ref, 'refs/tags/extras-')
        uses: softprops/action-gh-release@v2
        with: { files: chromeos-ps4-swap.zip }
